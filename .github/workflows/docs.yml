# This workflow builds the API documentation with MkDocs and publishes it to
# GitHub Pages. The docstrings are read from the installed package, so the
# extension module has to be built first, exactly as in tests.yml.
#
# One-time setup: in the repository, go to Settings -> Pages and set
# "Source" to "GitHub Actions". The site is then served from
# https://<owner>.github.io/<repository>/

name: Build documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material 'mkdocstrings[python]' \
                    mkdocs-include-markdown-plugin black
    - name: Install package
      run: |
        pip install .
    - name: Build documentation
      run: |
        # --strict turns every warning into an error, so a docstring that
        # stops parsing is caught here rather than silently vanishing
        # from the published page.
        mkdocs build --strict
    - name: Upload the site
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:

    # Only the main branch is published; a pull request is built but not
    # deployed, so that a broken page is caught before it goes live.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Publish to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
