site_name: GeneaKit
site_description: A set of functions for pedigree analysis, based on the functionality of R's GENLIB
site_url: https://genopop.github.io/geneakit/
repo_url: https://github.com/Genopop/geneakit
repo_name: Genopop/geneakit
copyright: Copyright &copy; 2026 Gilles-Philippe Morin

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Reference:
      - Creating a pedigree: reference/create.md
      - Exporting a pedigree: reference/output.md
      - Identifying individuals: reference/identify.md
      - Extracting a subpedigree: reference/extract.md
      - Describing a pedigree: reference/describe.md
      - Computing coefficients: reference/compute.md
      - Drawing a pedigree: reference/graph.md

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              # Every entry under Returns: gives a type, not a name, as in
              # "list: Half-founder IDs"; and several functions take their
              # keyword arguments through **kwargs, documenting each by name.
              returns_named_value: false
              warn_unknown_params: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: table
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
